[package]
name = "lott"
version = "0.9.8"
description = "Local Japanese transcription desktop app"
authors = ["you"]
edition = "2021"

[lib]
name = "lott_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Linux の AppImage では、同梱 GTK3 の翻訳カタログや xdg-user-dirs の表示環境が
# ホストのデスクトップ環境と一致しないことがある。XDG Desktop Portal を使うと、
# ホスト側のファイル選択 UI と user-dirs 設定を利用できる。Windows/macOS では
# 従来の既定バックエンドを維持する（下の target-specific dependency を参照）。
zip = { version = "0.6", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
regex = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-dialog = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# 公式配布では有効にしない。LM Studio / Ollama 連携が必要な利用者が
# ソースから専用インストーラーをビルドするときだけ指定する。
local-llm-apps = []

# WebView2 のクラッシュダンプが Microsoft へ自動送信されないよう、
# EnvironmentOptions を設定する最小パッチを適用した Wry。
# 上流で同等の設定が公開されたら crates.io 版へ戻す。
[patch.crates-io]
wry = { path = "../vendor/wry" }
